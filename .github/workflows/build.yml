name: Build workerd linux-arm64 (39-bit VAS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Install Bazelisk and clang-19 with libc++
        run: |
          curl -Lo bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-arm64
          chmod +x bazel && sudo mv bazel /usr/local/bin/bazel
          # clang 19+ required for --embed-dir (C23 #embed)
          # workerd uses -stdlib=libc++ so we need libc++-19-dev, not g++/libstdc++
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 19
          sudo apt-get install -y libc++-19-dev libc++abi-19-dev lld-19

      - name: Clone workerd v1.20260520.1
        run: git clone --depth=1 --branch v1.20260520.1 https://github.com/cloudflare/workerd

      - name: Clone TCMalloc at workerd's pinned commit and patch kAddressBits
        run: |
          git clone https://github.com/google/tcmalloc
          cd tcmalloc && git checkout 12f2552
          grep "kAddressBits" tcmalloc/internal/config.h
          sed -i 's/inline constexpr int kAddressBits = 48;/inline constexpr int kAddressBits = 39;/g' tcmalloc/internal/config.h
          grep "kAddressBits" tcmalloc/internal/config.h

      - name: Build workerd with patched TCMalloc
        working-directory: workerd
        run: |
          bazel build \
            --override_module=tcmalloc=$(realpath ../tcmalloc) \
            --action_env=CC=clang-19 \
            --action_env=CXX=clang++-19 \
            --action_env=LD=lld-19 \
            --config=release_linux \
            //src/workerd/server:workerd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: workerd-linux-arm64-39bit-v1.20260520.1
          path: workerd/bazel-bin/src/workerd/server/workerd
          retention-days: 90
