name: Build workerd linux-arm64 (39-bit VAS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Install Bazelisk and build deps
        run: |
          curl -Lo bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-arm64
          chmod +x bazel && sudo mv bazel /usr/local/bin/bazel
          sudo apt-get update -y && sudo apt-get install -y clang lld

      - name: Clone workerd v1.20260520.1
        run: git clone --depth=1 --branch v1.20260520.1 https://github.com/cloudflare/workerd

      - name: Fetch Bazel dependencies
        working-directory: workerd
        run: bazel fetch //src/workerd/server:workerd

      - name: Patch TCMalloc kAddressBits 48 → 39
        working-directory: workerd
        run: |
          CONFIG=$(find "$(bazel info output_base)" -path "*/tcmalloc/internal/config.h" | head -1)
          echo "Patching: $CONFIG"
          grep "kAddressBits" "$CONFIG"
          sed -i 's/inline constexpr int kAddressBits = 48;/inline constexpr int kAddressBits = 39;/' "$CONFIG"
          grep "kAddressBits" "$CONFIG"

      - name: Build
        working-directory: workerd
        run: bazel build --config=release_linux //src/workerd/server:workerd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: workerd-linux-arm64-39bit-v1.20260520.1
          path: workerd/bazel-bin/src/workerd/server/workerd
          retention-days: 30
